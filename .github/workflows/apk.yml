name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web assets (game is bundled inside the APK = no download, no PWA)
        working-directory: apk
        run: |
          rm -rf www && cp -r ../client www
          npm install --no-audit --no-fund
          npx cap add android
      - name: Landscape, fullscreen, hardware acceleration, icon
        working-directory: apk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true" /' $M
          sed -i 's#<style name="AppTheme.NoActionBarLaunch"#<style name="AppTheme.NoActionBarLaunch"#' android/app/src/main/res/values/styles.xml
          sudo apt-get install -y imagemagick >/dev/null
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; dir=android/app/src/main/res/mipmap-$n
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do convert ../client/assets/icons/icon-512.png -resize ${s}x${s} $dir/$f.png; done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
          cat > android/app/src/main/java/com/andhra/underworld/MainActivity.java <<'J'
          package com.andhra.underworld;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }
          }
          J
      - name: Build APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AndhraUnderworld-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
